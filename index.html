<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio Flow - SaaS Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="./css/style.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: '#2563EB', sidebar: '#0F172A', surface: '#F8FAFC' }
        }
      }
    }
  </script>
</head>
<body class="bg-surface text-slate-800 antialiased min-h-screen flex">

  <!-- Toast 提示區 -->
  <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none print:hidden"></div>

  <!-- 左側 Sidebar (動態渲染) -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-sidebar text-slate-300 flex flex-col justify-between border-r border-slate-800 print:hidden">
    <div>
      <div class="p-5 border-b border-slate-800 flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-brand text-white flex items-center justify-center font-black">Q</div>
        <div>
          <h1 class="font-bold text-sm text-white">Studio Flow</h1>
          <p class="text-[10px] text-slate-400">Pro Enterprise SaaS</p>
        </div>
      </div>
      <!-- 動態 Navigation -->
      <nav id="sidebar-nav" class="p-3 space-y-1 text-xs font-semibold"></nav>
    </div>
    
    <div class="p-3 border-t border-slate-800 space-y-2">
      <button data-action="open-editor" data-type="Invoice" class="btn-primary w-full">＋ New Invoice</button>
      <button data-action="open-editor" data-type="Quote" class="btn-secondary w-full">＋ New Quote</button>
    </div>
  </aside>

  <!-- 主內容區 -->
  <main class="flex-1 md:ml-64 min-h-screen flex flex-col print:ml-0 print:p-0">
    <!-- 動態 Header -->
    <header id="main-header" class="bg-white border-b border-slate-200/80 px-8 py-3 flex justify-between items-center sticky top-0 z-20 print:hidden"></header>

    <div class="p-8 space-y-6 flex-1 print:p-0">
      
      <!-- 1. DASHBOARD VIEW -->
      <section id="view-dashboard" class="view-section space-y-6">
        <div id="dashboard-cards" class="grid grid-cols-2 lg:grid-cols-4 gap-4"></div>
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <div class="lg:col-span-2 card p-5">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">Revenue Trend</h3>
            <canvas id="chart-revenue" class="max-h-60"></canvas>
          </div>
          <div class="card p-5">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">Document Distribution</h3>
            <canvas id="chart-ratio" class="max-h-60"></canvas>
          </div>
        </div>
      </section>

      <!-- 2. CLIENTS VIEW -->
      <section id="view-clients" class="view-section hidden space-y-4">
        <div class="flex justify-between items-center">
          <h3 class="text-sm font-bold text-slate-900">客戶管理 (Clients)</h3>
          <button data-action="open-client-modal" class="btn-primary">+ 新增客戶</button>
        </div>
        <div class="card overflow-hidden">
          <div id="clients-table-container"></div>
        </div>
      </section>

      <!-- 3. INVOICES VIEW -->
      <section id="view-invoices" class="view-section hidden space-y-4">
        <div class="flex justify-between items-center">
          <h3 class="text-sm font-bold text-slate-900">發票管理 (Invoices)</h3>
          <button data-action="open-editor" data-type="Invoice" class="btn-primary">+ New Invoice</button>
        </div>
        <div class="card overflow-hidden">
          <div id="invoices-table-container"></div>
        </div>
      </section>

      <!-- 4. QUOTES VIEW -->
      <section id="view-quotes" class="view-section hidden space-y-4">
        <div class="flex justify-between items-center">
          <h3 class="text-sm font-bold text-slate-900">報價單管理 (Quotes)</h3>
          <button data-action="open-editor" data-type="Quote" class="btn-primary">+ New Quote</button>
        </div>
        <div class="card overflow-hidden">
          <div id="quotes-table-container"></div>
        </div>
      </section>

      <!-- 5. FULL PAGE EDITOR -->
      <section id="view-fullpage-editor" class="view-section hidden space-y-6">
        <div class="flex justify-between items-center border-b border-slate-200 pb-4">
          <div>
            <span data-field="editor-type" class="px-2 py-0.5 rounded text-xs font-semibold bg-blue-50 text-brand">INVOICE</span>
            <h2 data-field="editor-title" class="text-xl font-bold text-slate-900 mt-1">New Document</h2>
          </div>
          <button data-action="switch-tab" data-tab="invoices" class="btn-secondary">← 返回列表</button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
          <div class="lg:col-span-2 space-y-6">
            <div class="card p-5 space-y-4">
              <h3 class="text-xs font-bold text-slate-400 uppercase">1. 選擇客戶</h3>
              <select id="editor-client-select" class="w-full p-2.5 border border-slate-200 rounded-xl text-xs bg-slate-50 font-medium">
                <option value="">-- 請選擇客戶 --</option>
              </select>
            </div>

            <div class="card p-5 space-y-4">
              <div class="flex justify-between items-center">
                <h3 class="text-xs font-bold text-slate-400 uppercase">2. 服務項目列表</h3>
                <button data-action="add-editor-item" class="text-xs text-brand font-semibold hover:underline">+ 新增自訂項目</button>
              </div>
              <div id="editor-items-container" class="space-y-3"></div>
            </div>
          </div>

          <div class="card p-6 space-y-4 h-fit sticky top-20">
            <h3 class="text-xs font-bold text-slate-400 uppercase">單據摘要</h3>
            <div class="space-y-3 text-xs">
              <div><label class="block font-medium text-slate-600 mb-1">狀態</label><select id="editor-status" class="w-full p-2 border rounded-xl bg-slate-50"><option value="Draft">Draft</option><option value="Sent">Sent</option><option value="Paid">Paid</option></select></div>
              <div><label class="block font-medium text-slate-600 mb-1">發出日期</label><input type="date" id="editor-issue-date" class="w-full p-2 border rounded-xl"></div>
              <div><label class="block font-medium text-slate-600 mb-1">到期日期</label><input type="date" id="editor-due-date" class="w-full p-2 border rounded-xl"></div>
            </div>
            <div class="pt-4 border-t border-slate-200">
              <span class="text-xs text-slate-400 font-semibold uppercase">總金額</span>
              <p data-field="editor-calculated-total" class="text-3xl font-black text-slate-900 mt-1">HK$0</p>
            </div>
            <button data-action="save-document" class="btn-primary w-full py-3">儲存並建立單據</button>
          </div>
        </div>
      </section>

      <!-- 6. SETTINGS VIEW -->
      <section id="view-settings" class="view-section hidden card p-6 space-y-4 max-w-2xl">
        <h3 class="text-sm font-bold border-b border-slate-100 pb-3 text-slate-900">系統設定</h3>
        <p class="text-xs text-slate-500">系統參數與公司資料構建中...</p>
      </section>

    </div>
  </main>

  <!-- MODAL CONTAINER (通用 Modal) -->
  <div id="modal-container" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50"></div>

  <!-- 主邏輯入口 -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
