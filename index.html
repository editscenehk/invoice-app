<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaaS Quote & Invoice Manager</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom Scrollbar for smooth UX */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

  <div class="flex flex-1 min-h-screen">
    
    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col border-r border-slate-800 shrink-0">
      <div class="p-5 border-b border-slate-800 flex items-center justify-between">
        <span class="font-bold text-lg text-white tracking-wide">Workspace</span>
        <span class="text-xs bg-blue-600/30 text-blue-400 font-semibold px-2 py-0.5 rounded-full border border-blue-500/30">PRO</span>
      </div>

      <nav class="flex-1 p-3 space-y-1">
        <button data-nav="dashboard" class="nav-btn w-full flex items-center px-3 py-2.5 text-sm font-medium rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition-colors">
          <span class="mr-3">📊</span> Dashboard
        </button>
        <button data-nav="invoices" class="nav-btn w-full flex items-center px-3 py-2.5 text-sm font-medium rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition-colors">
          <span class="mr-3">📄</span> Invoices
        </button>
        <button data-nav="quotes" class="nav-btn w-full flex items-center px-3 py-2.5 text-sm font-medium rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition-colors">
          <span class="mr-3">📝</span> Quotes
        </button>
        <button data-nav="clients" class="nav-btn w-full flex items-center px-3 py-2.5 text-sm font-medium rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition-colors">
          <span class="mr-3">👥</span> Clients
        </button>
      </nav>

      <div class="p-4 border-t border-slate-800 text-xs text-slate-500 text-center">
        v2.0 • Full-Page Mode
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col min-w-0 bg-slate-50">
      
      <!-- Top Header -->
      <header class="h-16 bg-white border-b border-slate-200/80 px-8 flex items-center justify-between shrink-0">
        <h1 id="header-title" class="text-xl font-bold text-slate-900">Dashboard</h1>
        <div id="header-actions" class="flex items-center space-x-3">
          <!-- Dynamic Header Buttons generated by UI.renderHeader -->
        </div>
      </header>

      <!-- View Containers -->
      <div class="flex-1 p-8 overflow-y-auto">
        
        <!-- Dashboard View -->
        <section id="view-dashboard" class="view-section space-y-6">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm">
              <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Total Outstanding</div>
              <div class="text-2xl font-bold text-slate-900">HK$128,500</div>
            </div>
            <div class="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm">
              <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Paid This Month</div>
              <div class="text-2xl font-bold text-emerald-600">HK$45,000</div>
            </div>
            <div class="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm">
              <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Pending Quotes</div>
              <div class="text-2xl font-bold text-amber-500">4 Active</div>
            </div>
          </div>
        </section>

        <!-- Invoices View -->
        <section id="view-invoices" class="view-section hidden">
          <div id="invoices-table-container"></div>
        </section>

        <!-- Quotes View -->
        <section id="view-quotes" class="view-section hidden">
          <div id="quotes-table-container"></div>
        </section>

        <!-- Clients View -->
        <section id="view-clients" class="view-section hidden space-y-6">
          <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-bold text-slate-800">Client Directory</h2>
            <button id="btn-add-client" class="bg-slate-900 text-white text-xs px-4 py-2 rounded-xl font-medium hover:bg-slate-800 transition-colors">+ Add Client</button>
          </div>
          <div id="clients-list-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </section>

        <!-- Full Page Document Editor -->
        <section id="view-fullpage-editor" class="view-section hidden">
          <div class="max-w-4xl mx-auto bg-white rounded-2xl border border-slate-200/80 shadow-sm p-8 space-y-6">
            
            <div class="flex items-center justify-between border-b border-slate-100 pb-4">
              <div class="flex items-center space-x-3">
                <span id="editor-type-badge" class="bg-blue-100 text-blue-700 text-xs font-extrabold px-2.5 py-1 rounded-md tracking-wider">INVOICE</span>
                <h2 id="editor-title-heading" class="text-xl font-bold text-slate-900">New Invoice</h2>
              </div>
              <button id="btn-close-editor" class="text-slate-400 hover:text-slate-600 text-sm font-medium">Cancel</button>
            </div>

            <!-- Header Info Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 bg-slate-50/50 p-4 rounded-xl border border-slate-100">
              <div class="space-y-4">
                <div>
                  <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Client *</label>
                  <select id="editor-client-select" class="w-full p-2.5 border border-slate-200 rounded-xl text-sm bg-white focus:outline-none focus:border-blue-500">
                    <option value="">Select a Client...</option>
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">JOB 名稱 / 項目名稱 *</label>
                  <input type="text" id="editor-job-name" placeholder="例如：2026 品牌網站重新設計與開發" class="w-full p-2.5 border border-slate-200 rounded-xl text-sm bg-white focus:outline-none focus:border-blue-500">
                </div>
              </div>

              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Status</label>
                  <select id="editor-status" class="w-full p-2.5 border border-slate-200 rounded-xl text-sm bg-white focus:outline-none focus:border-blue-500">
                    <option value="Draft">Draft</option>
                    <option value="Sent">Sent</option>
                    <option value="Paid">Paid</option>
                    <option value="Overdue">Overdue</option>
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Issue Date</label>
                  <input type="date" id="editor-issue-date" class="w-full p-2.5 border border-slate-200 rounded-xl text-sm bg-white focus:outline-none focus:border-blue-500">
                </div>
                <div class="col-span-2">
                  <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Due Date</label>
                  <input type="date" id="editor-due-date" class="w-full p-2.5 border border-slate-200 rounded-xl text-sm bg-white focus:outline-none focus:border-blue-500">
                </div>
              </div>
            </div>

            <!-- Item Table Editor -->
            <div class="space-y-3">
              <div class="flex justify-between items-center">
                <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider">Service Items & Line Details</h3>
                <button type="button" id="btn-add-item-row" class="text-xs text-blue-600 font-bold hover:text-blue-700">+ Add Row</button>
              </div>

              <div class="grid grid-cols-12 gap-2 text-xs font-bold text-slate-400 px-2">
                <div class="col-span-6">Description / 細項描述</div>
                <div class="col-span-2 text-center">Qty</div>
                <div class="col-span-3 text-right">Price (HK$)</div>
                <div class="col-span-1"></div>
              </div>

              <div id="editor-items-container" class="space-y-2">
                <!-- Row items appended dynamically -->
              </div>
            </div>

            <!-- Summary & Actions -->
            <div class="border-t border-slate-100 pt-4 flex items-center justify-between">
              <div>
                <span class="text-xs text-slate-400 block font-medium">Total Amount</span>
                <span id="editor-calculated-total" class="text-2xl font-bold text-slate-900">HK$0</span>
              </div>
              <div class="flex space-x-3">
                <button type="button" id="btn-save-document" class="bg-blue-600 text-white px-6 py-2.5 rounded-xl font-bold text-sm hover:bg-blue-700 transition-colors shadow-sm">Save & Generate</button>
              </div>
            </div>

          </div>
        </section>

      </div>
    </main>
  </div>

  <!-- Detail View Side Drawer -->
  <div id="detail-drawer" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden transition-opacity">
    <div class="absolute inset-y-0 right-0 w-full max-w-lg bg-white shadow-2xl flex flex-col">
      <div class="p-6 border-b border-slate-200 flex justify-between items-center">
        <div>
          <span id="drawer-doc-type" class="text-xs font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-600">INVOICE</span>
          <h2 id="drawer-doc-number" class="text-lg font-bold text-slate-900 mt-1">INV-2026-001</h2>
        </div>
        <button id="btn-close-drawer" class="text-slate-400 hover:text-slate-600 font-bold text-lg">✕</button>
      </div>

      <div id="drawer-content" class="flex-1 p-6 overflow-y-auto space-y-6">
        <!-- Content rendered via UI.openDetailDrawer -->
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col space-y-2 pointer-events-none"></div>

  <!-- Application Bundle -->
  <script type="module" src="./js/app.js?v=3"></script>
</body>
</html>
